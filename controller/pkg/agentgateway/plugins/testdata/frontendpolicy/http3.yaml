apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: test
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: defaults
  namespace: default
spec:
  gatewayClassName: agentgateway
  listeners:
    - name: http
      protocol: HTTP
      port: 8080
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: http3-policy
  namespace: default
spec:
  targetRefs:
  - kind: Gateway
    name: test
    group: gateway.networking.k8s.io
  frontend:
    http:
      http3:
        altSvcMaxAge: 1h
        idleTimeout: 45s
        maxConcurrentStreams: 50
        altSvcPort: 443
        requestHeaderTimeout: 10s
        keepAliveInterval: 15s
---
apiVersion: agentgateway.dev/v1alpha1
kind: AgentgatewayPolicy
metadata:
  name: http3-defaults-policy
  namespace: default
spec:
  targetRefs:
  - kind: Gateway
    name: defaults
    group: gateway.networking.k8s.io
  frontend:
    http:
      http3: {}

---
